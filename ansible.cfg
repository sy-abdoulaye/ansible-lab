[defaults]
inventory = inventory/hosts.yaml
roles_path = playbooks/roles
# Lab : les clés d'hôte des routeurs ne sont pas gérées dans un known_hosts.
host_key_checking = False
deprecation_warnings = False
retry_files_enabled = False

[persistent_connection]
# Certaines commandes IOS-XR (show bgp, show running-config) dépassent 30 s.
command_timeout = 60
